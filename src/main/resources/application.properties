# Keep offline diff, search, retrieval, and tests independent of API credentials.
spring.ai.model.chat=${SPRING_AI_MODEL_CHAT:none}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.model=${APIDEPENDABOT_MODEL:gpt-5-mini}
# Retry transient provider errors without allowing an unbounded retry loop.
spring.ai.openai.max-retries=2
