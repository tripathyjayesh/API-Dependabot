openapi: 3.0.3
info: {title: Nested consumer fields, version: v2}
paths:
  /subscription_schedules:
    post:
      operationId: createSchedule
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                phases:
                  type: array
                  items:
                    type: object
                    properties:
                      duration:
                        type: object
                        properties:
                          interval: {type: string}
                          interval_count: {type: integer}
                      price: {type: string}
      responses:
        '200': {description: created}
  /subscriptions/{id}:
    get:
      operationId: retrieveSubscription
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses:
        '200':
          description: subscription
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: {type: string}
                  discounts:
                    type: array
                    items:
                      type: object
                      properties:
                        id: {type: string}
                        source:
                          type: object
                          properties:
                            type: {type: string}
                            coupon: {type: string}
